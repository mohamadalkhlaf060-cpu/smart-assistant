
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Assistant</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#101525;
 color:white;
 display:flex;
 height:100vh;
 overflow:hidden;
}

.sidebar{
 width:260px;
 background:#171f33;
 padding:20px;
 display:flex;
 flex-direction:column;
}

.logo{
 font-size:22px;
 color:#91a1ff;
 font-weight:bold;
 margin-bottom:30px;
}

.newchat{
 background:#657cff;
 border:0;
 padding:14px;
 border-radius:12px;
 color:white;
 cursor:pointer;
 font-size:15px;
}

.sidebar p{color:#aab2c5}

.main{
 flex:1;
 display:flex;
 flex-direction:column;
}

header{
 padding:20px;
 border-bottom:1px solid #29334b;
 font-size:20px;
 font-weight:bold;
}

#messages{
 flex:1;
 overflow-y:auto;
 padding:25px;
 max-width:850px;
 width:100%;
 margin:auto;
}

.message{
 padding:15px 20px;
 border-radius:15px;
 margin:15px 0;
 line-height:1.8;
 max-width:85%;
 overflow-wrap:anywhere;
}

.user{
 background:#34436b;
 margin-right:auto;
}

.bot{
 background:#202b46;
 margin-left:auto;
}

.welcome{
 text-align:center;
 margin-top:100px;
}

.welcome h1{
 color:#91a1ff;
 font-size:35px;
}

.input-area{
 padding:20px;
 display:flex;
 gap:10px;
 max-width:850px;
 width:100%;
 margin:auto;
}

input{
 flex:1;
 background:#202b46;
 border:1px solid #35415e;
 color:white;
 padding:17px;
 border-radius:14px;
 outline:none;
 font-size:16px;
}

button{
 cursor:pointer;
}

.send{
 background:#657cff;
 border:0;
 color:white;
 padding:15px 22px;
 border-radius:12px;
}

@media(max-width:650px){
 .sidebar{width:75px;padding:10px}
 .logo{font-size:12px}
 .newchat{font-size:12px;padding:10px 4px}
 .sidebar p{display:none}
 .welcome h1{font-size:25px}
 #messages{padding:12px}
}
</style>
</head>

<body>

<aside class="sidebar">
 <div class="logo">🤖 Smart AI</div>
 <button class="newchat" onclick="newChat()">＋ محادثة جديدة</button>
 <p>مساعدك الذكي الشخصي</p>
</aside>

<main class="main">

<header>Smart Assistant ✨</header>

<div id="messages">
 <div class="welcome" id="welcome">
  <h1>مرحباً بك ❤️</h1>
  <p>كيف أستطيع مساعدتك اليوم؟</p>
 </div>
</div>

<div class="input-area">
 <input id="userInput"
 placeholder="اكتب رسالتك هنا..."
 onkeydown="if(event.key==='Enter')sendMessage()">
 <button class="send" onclick="sendMessage()">إرسال</button>
</div>

</main>

<script>

function sendMessage(){

 let input=document.getElementById("userInput");
 let messages=document.getElementById("messages");
 let text=input.value.trim();

 if(!text)return;

 document.getElementById("welcome")?.remove();

 let user=document.createElement("div");
 user.className="message user";
 user.textContent=text;
 messages.appendChild(user);

 let bot=document.createElement("div");
 bot.className="message bot";
 bot.textContent="مرحباً! أنا Smart Assistant 🤖";
 messages.appendChild(bot);

 input.value="";
 messages.scrollTop=messages.scrollHeight;
}

function newChat(){
 document.getElementById("messages").innerHTML=`
 <div class="welcome" id="welcome">
 <h1>مرحباً بك ❤️</h1>
 <p>كيف أستطيع مساعدتك اليوم؟</p>
 </div>`;
}

</script>

</body>
</html>
